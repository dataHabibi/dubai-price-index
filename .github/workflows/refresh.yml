name: Refresh series

# Committed CSVs drift from the live site within weeks, and a stale dataset is
# worse than no dataset. This pulls both series monthly and commits only when
# the numbers actually move, so the history stays a record of revisions rather
# than a wall of empty commits.
on:
  schedule:
    # 06:00 UTC on the 4th. Land Department records lag one to two months, so
    # running early in the month adds nothing; the 4th lets the previous
    # month's late registrations land first.
    - cron: '0 6 4 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull the current series
        run: ./refresh.sh

      - name: Fail if a file came back empty
        run: |
          for f in data/dubai-price-index-monthly.csv data/dubai-rent-index-monthly.csv; do
            rows=$(( $(wc -l < "$f") - 1 ))
            echo "$f: $rows months"
            # A truncated response would otherwise be committed as a silent
            # deletion of history.
            if [ "$rows" -lt 150 ]; then
              echo "::error::$f has only $rows rows, refusing to commit"
              exit 1
            fi
          done

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- data; then
            echo "No change this month."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Refresh series, $(date -u +'%B %Y')"
          git push
